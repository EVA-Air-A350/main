<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launch OpenScope (Chromebook)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0d1117;
        color: #e6edf3;
      }
      main {
        max-width: 820px;
        margin: 3rem auto;
        padding: 0 1.25rem;
      }
      .card {
        border: 1px solid #30363d;
        border-radius: 12px;
        background: #161b22;
        padding: 1rem 1.25rem;
      }
      code {
        background: #21262d;
        border-radius: 4px;
        padding: 0.15rem 0.35rem;
      }
      button {
        margin-top: 1rem;
        border: 1px solid #238636;
        background: #238636;
        color: white;
        font-size: 1rem;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #2ea043;
      }
      .muted {
        color: #8b949e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenScope Chromebook Launcher</h1>
      <div class="card">
        <p>
          This launcher is the <strong>Option 2</strong> approach: a top-level HTML file that forwards to the
          existing OpenScope build output in <code>openscope-6.28.0/public/index.html</code>.
        </p>
        <p>
          Keep all OpenScope files unchanged; this file only acts as the entry point.
        </p>
        <button id="launch-btn" type="button">Launch OpenScope</button>
        <p id="status" class="muted"></p>
      </div>
    </main>

    <script>
      (function () {
        const target = './openscope-6.28.0/public/index.html';
        const status = document.getElementById('status');

        function launch() {
          status.textContent = 'Opening ' + target + ' ...';
          window.location.href = target;
        }

        document.getElementById('launch-btn').addEventListener('click', launch);

        // Optional auto-redirect after a short delay to reduce taps on Chromebook.
        setTimeout(launch, 1200);
      })();
    </script>
  </body>
</html>
